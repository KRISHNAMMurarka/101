plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.oneohone.link.watch'
version = '0.1.0'

android {
  namespace "com.oneohone.link.watch"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The Data Layer. This is the only Google dependency the phone-side receiver needs.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  // Bridges Play Services Tasks to coroutines so node discovery can be awaited.
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
}
