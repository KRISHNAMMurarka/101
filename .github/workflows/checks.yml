name: Games application gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 101
    steps:
      - uses: actions/checkout@v4
        with:
          path: 101
          fetch-depth: 0
      # The sibling repositories are private. Their read credential is an external
      # integration requirement; an absent credential must not produce a green gate.
      - name: Require access to the platform and shared kit
        env:
          CONNECT_READ_TOKEN: ${{ secrets.CONNECT_READ_TOKEN }}
        run: |
          if [ -z "$CONNECT_READ_TOKEN" ]; then
            echo 'Connect and kit checkout require the repository CONNECT_READ_TOKEN secret with read access to both. External integration remains deferred until configured.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: edilec-global/uynis-connect
          ref: 3a8b43f9fc846a9a5590cb8032f4d31c5d6abd46
          token: ${{ secrets.CONNECT_READ_TOKEN }}
          path: uynis-connect
      - uses: actions/checkout@v4
        with:
          repository: edilec-global/uynis-kit
          ref: 4e2446293a495813e53cd89c0844a5bd071c114f
          token: ${{ secrets.CONNECT_READ_TOKEN }}
          path: uynis-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            101/package-lock.json
            uynis-connect/package-lock.json
      - run: npm ci --prefix ../uynis-connect
      - run: npm run build:sdk --prefix ../uynis-connect
      - run: npm ci
      # Rendered HTML checks always consume this revision's production build.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: node --test tests/rendered-html.test.mjs
      - run: node tools/audit-platform-records.mjs
      - run: npm run license:inventory
      - run: git diff --exit-code THIRD_PARTY_LICENSES.json
      - run: npm run audit:production
